apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: wordpress-app
  labels:
    app: mysql-backup
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mysql-backup
              image: mariadb:10.6.4-focal
              envFrom:
                - configMapRef:
                    name: db-cm    # MYSQL_HOST, MYSQL_DATABASE, MYSQL_USER
                - secretRef:
                    name: aws-backup-secret  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_BUCKET, AWS_REGION
              env:
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-pass          
                      key: MYSQL_PASSWORD
              
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  echo "📦 Installing AWS CLI..."
                  apt-get update -qq && apt-get install -y -qq awscli

                  TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
                  BACKUP_FILE="/tmp/backup_${TIMESTAMP}.sql.gz"
                  S3_KEY="backups/mysql/backup_${TIMESTAMP}.sql.gz"

                  echo "🗄️ Dumping database: ${MYSQL_DATABASE}..."
                  mysqldump \
                    -h "${MYSQL_HOST}" \
                    -u "${MYSQL_USER}" \
                    -p"${MYSQL_PASSWORD}" \
                    "${MYSQL_DATABASE}" | gzip > "${BACKUP_FILE}"

                  echo "☁️ Uploading to s3://${AWS_S3_BUCKET}/${S3_KEY}..."
                  aws s3 cp "${BACKUP_FILE}" "s3://${AWS_S3_BUCKET}/${S3_KEY}" \
                    --region "${AWS_REGION}"

                  echo "🧹 Cleaning up..."
                  rm -f "${BACKUP_FILE}"

                  echo "✅ Backup complete: ${S3_KEY}"