apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: wordpress-app
spec:
  schedule: "5 0 * * *"   # every 5 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: db-backup
              image: mariadb:10.6.4-focal
              command:
                - /bin/bash
                - -c
                - |
                  apt-get install -y -qq curl && curl -fsSL https://rclone.org/install.sh | bash
                  BACKUP_FILE="backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  mysqldump -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" | gzip > "/tmp/$BACKUP_FILE"
                  rclone copy "/tmp/$BACKUP_FILE" gdrive:
              env:
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: wordpress-config
                      key: db_host
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: wordpress-config
                      key: db_name
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: wordpress-secret
                      key: db_user
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wordpress-secret
                      key: db_password
                # rclone reads these env vars automatically — no config file needed
                - name: RCLONE_CONFIG_GDRIVE_TYPE
                  value: "drive"
                - name: RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID
                  valueFrom:
                    secretKeyRef:
                      name: wordpress-secret
                      key: gdrive_folder_id
                - name: RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS
                  valueFrom:
                    secretKeyRef:
                      name: wordpress-secret
                      key: gdrive_sa_json