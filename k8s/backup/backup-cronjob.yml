apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: wordpress-app
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: db-backup
              image: ubuntu:22.04
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  apt-get update -qq
                  apt-get install -y -qq mariadb-client rclone ca-certificates
                  update-ca-certificates

                  BACKUP_FILE="/backup/backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  echo "Dumping '$DB_NAME'..."
                  mysqldump -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" | gzip > "$BACKUP_FILE"
                  echo "Saved: $BACKUP_FILE"

                  echo "Uploading to Google Drive..."
                  rclone copy "$BACKUP_FILE" gdrive:
                  echo "Upload done."

                  echo "Cleaning up files older than 20 minutes..."
                  find /backup -name "backup-*.sql.gz" -mmin +20 -delete
                  echo "All done."

              env:
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: wp-config
                      key: WORDPRESS_DB_HOST

                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: db-cm
                      key: MYSQL_DATABASE

                - name: DB_USER
                  valueFrom:
                    configMapKeyRef:
                      name: db-cm
                      key: MYSQL_USER

                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-pass
                      key: MYSQL_PASSWORD

                - name: RCLONE_CONFIG_GDRIVE_TYPE
                  value: "drive"

                - name: RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID
                  valueFrom:
                    secretKeyRef:
                      name: gdrive-secret
                      key: gdrive_folder_id

                - name: RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS
                  valueFrom:
                    secretKeyRef:
                      name: gdrive-secret
                      key: gdrive_sa_json

              volumeMounts:
                - name: backup-dir
                  mountPath: /backup

          volumes:
            - name: backup-dir
              hostPath:
                path: /tmp/db-backups
                type: DirectoryOrCreate